name: Windows build

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build portable executable
        shell: pwsh
        run: .\build-portable.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foto-acte-3x4-windows
          path: dist/Foto-acte-3x4.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: Foto-acte-3x4-windows
          path: release

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -LiteralPath "release\Foto-acte-3x4.exe" -DestinationPath "Foto-acte-3x4-windows.zip"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "Foto-acte-3x4-windows.zip" --clobber
          else
            gh release create "${{ github.ref_name }}" "Foto-acte-3x4-windows.zip" --generate-notes --title "Foto acte 3x4 ${{ github.ref_name }}"
          fi
